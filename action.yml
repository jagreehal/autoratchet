name: 'AutoRatchet'
description: 'Deterministic complexity gate for AI coding agents and CI: TypeScript, JavaScript, Rust, Python and Go, locally or on PRs.'
author: 'Jag Reehal'
branding:
  icon: 'trending-down'
  color: 'green'

inputs:
  path:
    description: 'Git pathspec(s) to measure, space separated, e.g. "src :!src/generated". Empty measures the whole repo.'
    default: ''
  base:
    description: 'Ref to compare against. Defaults to the PR base, or the previous commit on push.'
    default: ''
  threshold:
    description: 'Maximum cyclomatic complexity for new functions.'
    default: '10'
  cognitive-threshold:
    description: 'Maximum cognitive complexity for new functions.'
    default: '15'
  override-approval:
    description: >-
      How a new override comment (oxlint-disable / eslint-disable / biome-ignore for a complexity rule)
      gets approved. "none": the override approves its function's current score and the comment lists it.
      "strict": every new override fails the check. "review": a new override passes only once someone
      other than the PR author, with write access, approves the PR's current head commit.
      "label": passes when the PR has the approval-label (anyone with write access can add labels).
    default: 'none'
  approval-label:
    description: 'Label that approves new overrides when override-approval is "label".'
    default: 'complexity-override-approved'
  comment:
    description: 'Post (and keep updating) one comment on the pull request. Only posts once there is something to say.'
    default: 'true'
  annotations:
    description: 'Mark each regression on the function in the PR diff.'
    default: 'true'
  fail-on-regression:
    description: 'Fail the job on a regression or an incomplete measurement.'
    default: 'true'
  cli:
    description: 'Command that runs AutoRatchet. Empty downloads the release binary matching this action''s version.'
    default: ''
  github-token:
    description: 'Token used to read reviews and post the comment.'
    default: ${{ github.token }}

outputs:
  verdict:
    description: 'pass, fail or incomplete.'
    value: ${{ steps.check.outputs.verdict }}
  report:
    description: 'Path of the JSON report.'
    value: ${{ steps.check.outputs.report }}

runs:
  using: composite
  steps:
    - name: Resolve base
      id: refs
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
      run: |
        base="${INPUT_BASE:-${PR_BASE:-$PUSH_BEFORE}}"
        # First push of a branch has an all-zero "before".
        case "$base" in ''|0000000000000000000000000000000000000000) base=HEAD~1; git fetch --no-tags --deepen=1 origin 2>/dev/null || true ;; esac
        # A shallow checkout lacks the base; fetch it, then history back to where it meets HEAD,
        # so the check compares the change with its merge base, not the base branch's later commits.
        git fetch --no-tags --depth=1 origin "$base" 2>/dev/null || true
        for depth in 50 200 1000; do
          git merge-base "$base" HEAD >/dev/null 2>&1 && break
          git fetch --no-tags --deepen="$depth" origin "$base" 2>/dev/null || true
        done
        git merge-base "$base" HEAD >/dev/null 2>&1 || git fetch --no-tags --unshallow origin 2>/dev/null || true
        echo "base=$base" >> "$GITHUB_OUTPUT"

    - name: Install AutoRatchet
      id: cli
      shell: bash
      env:
        CLI: ${{ inputs.cli }}
        PATHS: ${{ inputs.path }}
        ACTION_REPO: ${{ github.action_repository }}
      run: |
        set -euo pipefail
        if [ -n "$CLI" ]; then
          echo "cli=$CLI" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) platform=linux-x64 target=x86_64-unknown-linux-musl ;;
          Linux-ARM64) platform=linux-arm64 target=aarch64-unknown-linux-musl ;;
          macOS-X64) platform=darwin-x64 target=x86_64-apple-darwin ;;
          macOS-ARM64) platform=darwin-arm64 target=aarch64-apple-darwin ;;
          Windows-X64) platform=win32-x64 target=x86_64-pc-windows-msvc ;;
          Windows-ARM64) platform=win32-arm64 target=aarch64-pc-windows-msvc ;;
          *) echo "::error::AutoRatchet has no binary for $RUNNER_OS $RUNNER_ARCH"; exit 1 ;;
        esac
        exe=""; [ "$RUNNER_OS" = Windows ] && exe=.exe
        dir="$RUNNER_TEMP/autoratchet-cli"
        mkdir -p "$dir"
        cd "$dir"

        # The release that matches this action's version, checked against its SHA256SUMS.
        version=$(jq -r .version "$GITHUB_ACTION_PATH/package.json")
        releases="https://github.com/${ACTION_REPO:-jagreehal/autoratchet}/releases/download/v$version"
        curl -fsSL --retry 3 -o "autoratchet-$platform.tar.gz" "$releases/autoratchet-$platform.tar.gz"
        curl -fsSL --retry 3 -o SHA256SUMS "$releases/SHA256SUMS"
        sum=sha256sum; command -v sha256sum >/dev/null || sum="shasum -a 256"
        grep " ./autoratchet-$platform.tar.gz\$" SHA256SUMS | sed 's| \./| |' | $sum -c -
        tar -xzf "autoratchet-$platform.tar.gz"
        echo "cli=$dir/autoratchet$exe" >> "$GITHUB_OUTPUT"

        # Oxlint measures cyclomatic complexity in JavaScript and TypeScript; Rust, Python and Go need none.
        # shellcheck disable=SC2086 # pathspecs split on purpose
        js=$(git -C "$GITHUB_WORKSPACE" ls-files -- ${PATHS:-.} | grep -cE '\.[cm]?[jt]sx?$' || true)
        if [ "$js" -gt 0 ]; then
          oxlint_version=$(jq -r .dependencies.oxlint "$GITHUB_ACTION_PATH/package.json")
          oxc="https://github.com/oxc-project/oxc/releases/download/oxlint_v$oxlint_version"
          if [ "$RUNNER_OS" = Windows ]; then
            curl -fsSL --retry 3 -o oxlint.zip "$oxc/oxlint-$target.zip"
            unzip -q oxlint.zip
          else
            curl -fsSL --retry 3 -o oxlint.tar.gz "$oxc/oxlint-$target.tar.gz"
            tar -xzf oxlint.tar.gz
          fi
          echo "AUTORATCHET_OXLINT=$dir/oxlint-$target$exe" >> "$GITHUB_ENV"
        fi

    - name: Decide override approval
      id: approval
      shell: bash
      env:
        MODE: ${{ inputs.override-approval }}
        LABEL: ${{ inputs.approval-label }}
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        AUTHOR: ${{ github.event.pull_request.user.login }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      run: |
        set -euo pipefail
        strict=false
        case "$MODE" in
          none) ;;
          strict) strict=true ;;
          label)
            # Anyone with write access can add a label, the author included. This keeps out agents
            # whose token cannot label; it does not stop a person approving their own override.
            echo "$LABELS" | jq -e --arg l "$LABEL" 'index($l)' >/dev/null || strict=true ;;
          review)
            strict=true
            if [ -n "$PR" ]; then
              # Latest review per reviewer; it must approve this exact commit and come from someone
              # other than the author. A new push makes older approvals not count.
              reviewers=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate | jq -rs --arg author "$AUTHOR" --arg head "$HEAD_SHA" '
                add | map(select(.user.login != $author and .state != "COMMENTED"))
                | group_by(.user.login) | map(last)
                | map(select(.state == "APPROVED" and .commit_id == $head)) | .[].user.login')
              # The reviewer's effective permission decides, so an org member with read access does not count.
              for login in $reviewers; do
                permission=$(gh api "repos/$REPO/collaborators/$login/permission" --jq .permission 2>/dev/null) || permission=
                case "$permission" in admin|write) strict=false; break ;; esac
              done
            fi ;;
          *) echo "::error::override-approval must be none, strict, review or label, got \"$MODE\""; exit 1 ;;
        esac
        echo "strict=$strict" >> "$GITHUB_OUTPUT"

    - name: Check
      id: check
      shell: bash
      env:
        CLI: ${{ steps.cli.outputs.cli }}
        PATHS: ${{ inputs.path }}
        BASE: ${{ steps.refs.outputs.base }}
        THRESHOLD: ${{ inputs.threshold }}
        COGNITIVE: ${{ inputs.cognitive-threshold }}
        STRICT: ${{ steps.approval.outputs.strict }}
      run: |
        set -uo pipefail
        out="$RUNNER_TEMP/autoratchet"
        mkdir -p "$out"
        strict_flag=()
        [ "$STRICT" = "true" ] && strict_flag=(--require-override-approval)
        # The runner adds -e; a regression (exit 1) must still reach the report below.
        status=0
        # shellcheck disable=SC2086
        $CLI check --base "$BASE" --threshold "$THRESHOLD" --cognitive-threshold "$COGNITIVE" \
          ${strict_flag[@]+"${strict_flag[@]}"} --format json -o "$out/report.json" -- $PATHS || status=$?
        if [ ! -s "$out/report.json" ]; then
          echo "::error::AutoRatchet failed (exit $status) before writing a report; see the log above."
          exit 1
        fi
        jq -r '"AutoRatchet: \(.verdict), \(.functions) functions measured, \(.regressions | length) regressions."' "$out/report.json"
        jq -r .markdown "$out/report.json" > "$out/report.md"
        cat "$out/report.md" >> "$GITHUB_STEP_SUMMARY"
        {
          echo "verdict=$(jq -r .verdict "$out/report.json")"
          echo "report=$out/report.json"
          echo "status=$status"
        } >> "$GITHUB_OUTPUT"

    - name: Annotate the diff
      if: inputs.annotations == 'true'
      shell: bash
      env:
        REPORT: ${{ steps.check.outputs.report }}
      run: |
        jq -r '.regressions[] |
          "::error file=\(.filePath),line=\(.line // 1),title=AutoRatchet: \(.functionName)::\(.metric) complexity \(.previous // "new") → \(.current) (limit \(if .kind == "new" then .threshold else ([.previous, .threshold] | max) end))"' \
          "$REPORT"

    - name: Post comment
      if: inputs.comment == 'true' && github.event.pull_request
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPORT: ${{ steps.check.outputs.report }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        marker='<!-- autoratchet -->'
        body="$RUNNER_TEMP/autoratchet/comment.md"
        { echo "$marker"; jq -r .markdown "$REPORT"; } > "$body"
        # Update only a comment this token posted: anyone can write the marker.
        # The default token can't read /user (gh prints the 403 body, so discard it); it posts as github-actions[bot].
        me=$(gh api user --jq .login 2>/dev/null) || me='github-actions[bot]'
        existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate 2>/dev/null \
          | jq -rs --arg me "$me" --arg marker "$marker" \
            'add // [] | map(select(.user.login == $me and (.body | startswith($marker)))) | .[0].id // empty') || existing=
        # A clean PR with nothing to say gets no comment, unless one exists to update.
        quiet=$(jq '.verdict == "pass" and (.approvals + .unmatchedOverrides + .untracked | length) == 0' "$REPORT")
        if [ "$quiet" = "true" ] && [ -z "$existing" ]; then exit 0; fi
        create() { gh api "repos/$REPO/issues/$PR/comments" -F body=@"$body" --silent; }
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@"$body" --silent || create
        else
          create
        fi || echo "::warning::could not post the AutoRatchet comment (read-only token? fork PR?). The report is in the job summary."

    - name: Gate
      if: inputs.fail-on-regression == 'true' && steps.check.outputs.verdict != 'pass'
      shell: bash
      env:
        VERDICT: ${{ steps.check.outputs.verdict }}
      run: |
        echo "::error::AutoRatchet: $VERDICT (see the PR comment or job summary)"
        exit 1
