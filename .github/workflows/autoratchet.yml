name: AutoRatchet

# Runs ./action.yml on this repo's own pull requests, with the binary built from the
# branch under review. New override comments need an approving review from someone
# other than the author, on the commit being merged.

on:
  pull_request:
    branches:
      - main
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: autoratchet-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build the binary
        run: pnpm build

      # conformance/cases holds deliberately complex code for the tests; measure the product only.
      - uses: ./
        with:
          path: crates :!crates/autoratchet/plugin bin scripts conformance/run.ts conformance/bench.ts conformance/fuzz.ts
          cli: node bin/autoratchet.js
          override-approval: review
