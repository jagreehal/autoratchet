name: AutoRatchet

# Runs ./action.yml on this repo's own pull requests, with the CLI built from the
# branch under review. New override comments need an approving review from someone
# other than the author, on the commit being merged.

on:
  pull_request:
    branches:
      - main
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: autoratchet-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the CLI
        run: pnpm build

      # examples/ and fixtures/ are deliberately complex teaching material.
      - uses: ./
        with:
          path: src
          cli: node dist/cli.js
          override-approval: review
