name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A newer push to a PR supersedes the run in progress. Each commit on main
# gets its own group, so every one of them keeps its run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Shell scripts
        run: shellcheck agent-hooks/claude-code/complexity-check.sh

      # The package as users get it: pack, install into a fresh project, run the binary.
      - name: Packed install
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/autoratchet-*.tgz
          set +e
          npx autoratchet compare --base "$GITHUB_WORKSPACE/test/fixtures/base" --head "$GITHUB_WORKSPACE/test/fixtures/head-fail"
          test $? -eq 1
