name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A newer push to a PR supersedes the run in progress. Each commit on main
# gets its own group, so every one of them keeps its run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # rust-toolchain.toml selects the Rust version; rustup installs it on first use.
      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      # Unit tests, then every conformance case: scores, names, reports and exit codes.
      - name: Test
        run: pnpm test

      - name: Shell scripts
        run: shellcheck agent-hooks/claude-code/complexity-check.sh

      - name: Action metadata meets GitHub Marketplace rules
        run: |
          description=$(yq '.description' action.yml)
          echo "description: ${#description} characters"
          [ "${#description}" -lt 125 ]
          yq -e '.branding.icon and .branding.color' action.yml

      # The package as users get it: pack, install into a fresh project, run the binary.
      - name: Packed install
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/autoratchet-*.tgz
          cases="$GITHUB_WORKSPACE/conformance/cases/fixture-fail"
          set +e
          npx autoratchet compare --base "$cases/base" --head "$cases/head"
          test $? -eq 1

  # The action as users run it: it downloads this version's release binary, and Oxlint for the
  # JavaScript paths. The release PR's version is not published yet, so it skips that one.
  action:
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - id: ratchet
        uses: ./
        with:
          path: crates bin
          comment: 'false'
          annotations: 'false'
          fail-on-regression: 'false'
      - name: The action measured the code
        shell: bash
        env:
          VERDICT: ${{ steps.ratchet.outputs.verdict }}
          REPORT: ${{ steps.ratchet.outputs.report }}
        run: |
          echo "verdict: $VERDICT"
          test -n "$VERDICT"
          test "$(jq '.functions' "$REPORT")" -gt 0
          test "$(jq '.incomplete | length' "$REPORT")" -eq 0
